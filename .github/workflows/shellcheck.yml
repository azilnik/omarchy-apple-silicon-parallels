name: ShellCheck
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -e SC1091 -e SC2029 -e SC2154 -e SC2034
        with:
          severity: warning
          scandir: '.'
          additional_files: 'omarchy-ssh vm-ssh'
